<!-- @dsCard group="Colour" height=330 subtitle="22 Cores Cergam, up to 3, with code labels" -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  body { margin: 0; padding: var(--space-5); background: var(--canvas); color: var(--ink); font-family: var(--font-sans); }
  .grid { display: grid; grid-template-columns: repeat(11, 1fr); gap: 20px 3px; max-width: 640px; }
  .sw { position: relative; aspect-ratio: 1; min-height: 44px; border: 0; padding: 0; background: none; cursor: pointer; display: grid; place-items: center; border-radius: var(--radius-round); }
  .sw:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .sw .c { width: calc(100% - 4px); aspect-ratio: 1; border-radius: var(--radius-round); border: 1px solid rgba(0,0,0,0.25); display: block; }
  .sw[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--primary); }
  .sw[aria-pressed="true"]::after { content: "\2713"; position: absolute; font: 600 14px/1 var(--font-sans); color: var(--chk, #fff); }
  .cd { position: absolute; bottom: -14px; left: 0; right: 0; text-align: center; font: 400 9px/1 var(--font-mono); color: var(--ink-faint); }
  .sel { margin-top: var(--space-6); font: 500 12px/16px var(--font-mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-faint); }
  .note { margin-top: var(--space-2); font-size: 14px; color: var(--ink-muted); }
</style>
</head>
<body>
  <div class="grid" id="g" role="group" aria-label="Cores Cergam"></div>
  <div class="sel" id="sel" aria-live="polite"></div>
  <div class="note">Cor aproximada no ecrã. Peça uma prova física.</div>
<script>
const S=[["C1","#221F20"],["C3","#929497"],["C4","#BBBDBF"],["C5","#DBDDDE"],["C6","#FEFEFE"],["C7","#C4AA78"],["C8","#551E11"],["C9","#A14726"],["C10","#CC936E"],["C11","#952A2E"],["C12","#D02129"],["C14","#F36E28"],["C15","#F3AD27"],["C16","#F4D033"],["C21","#1F5A32"],["C22","#00786E"],["C24","#318B40"],["C25","#9AC13B"],["C27","#68B9DD"],["C28","#5990CC"],["C29","#0087B4"],["C31","#003D6E"]];
const lum=h=>{const n=parseInt(h.slice(1),16),f=v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)};return .2126*f(n>>16)+.7152*f((n>>8)&255)+.0722*f(n&255)};
const pick=[11,3];const g=document.getElementById("g");
g.innerHTML=S.map((c,i)=>`<button class="sw" type="button" data-i="${i}" aria-label="${c[0]}" aria-pressed="${pick.includes(i)}" style="--chk:${lum(c[1])>.6?"#0B1B33":"#fff"}"><span class="c" style="background:${c[1]}"></span><span class="cd">${c[0]}</span></button>`).join("");
const paint=()=>{document.querySelectorAll(".sw").forEach(b=>b.setAttribute("aria-pressed",pick.includes(+b.dataset.i)));document.getElementById("sel").textContent=pick.length+" de 3 cores: "+pick.map(i=>S[i][0]).join(", ")};
g.addEventListener("click",e=>{const b=e.target.closest(".sw");if(!b)return;const i=+b.dataset.i,k=pick.indexOf(i);if(k>-1)pick.splice(k,1);else if(pick.length<3)pick.push(i);paint()});paint();
</script>
</body>
</html>
