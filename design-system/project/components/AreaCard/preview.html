<!-- @dsCard group="Navigation" height=230 subtitle="Five business areas, tinted band with ink text" -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Public+Sans:wght@400;600&display=swap">
<style>
  body { margin: 0; padding: var(--space-5); background: var(--canvas); color: var(--ink); font-family: var(--font-sans); }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: var(--space-4); }
  .card { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-card); text-decoration: none; color: inherit; transition: box-shadow var(--dur-base) var(--ease-standard); }
  .card:hover { box-shadow: var(--raised); }
  .card:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .hd { padding: var(--space-3) var(--space-4); font: 500 18px/1.25 var(--font-display); color: #0B1B33; }
  .ph { height: 64px; background: var(--sunken); border-block: 1px solid var(--border); }
  .bd { padding: var(--space-3) var(--space-4) var(--space-4); font-size: 14px; line-height: 21px; color: var(--ink-muted); }
</style>
</head>
<body>
  <div class="grid">
    <a class="card" href="#"><div class="hd" style="background:var(--tint-agua)">Vidro para água</div><div class="ph"></div><div class="bd">Garrafas para água filtrada e purificada.</div></a>
    <a class="card" href="#"><div class="hd" style="background:var(--tint-vinho)">Vinho e espirituosas</div><div class="ph"></div><div class="bd">Garrafas para a sua marca, em pequenas séries.</div></a>
    <a class="card" href="#"><div class="hd" style="background:var(--tint-azeite)">Azeite</div><div class="ph"></div><div class="bd">Garrafas escuras e transparentes.</div></a>
    <a class="card" href="#"><div class="hd" style="background:var(--tint-porcelana)">Porcelana decorada</div><div class="ph"></div><div class="bd">Pratos, chávenas e canecas.</div></a>
    <a class="card" href="#"><div class="hd" style="background:var(--tint-serigrafia)">Serigrafia direta</div><div class="ph"></div><div class="bd">Impressão direta em vidro.</div></a>
  </div>
</body>
</html>
