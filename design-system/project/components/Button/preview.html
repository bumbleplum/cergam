<!-- @dsCard group="Actions" height=150 subtitle="Primary, secondary and link-arrow" -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
  body { margin: 0; padding: var(--space-5); background: var(--canvas); color: var(--ink); font-family: var(--font-sans); }
  .label { font: 500 12px/16px var(--font-mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-faint); margin-bottom: var(--space-3); }
  .row { display: flex; flex-wrap: wrap; gap: var(--space-3); align-items: center; }
  .btn { min-height: 48px; padding: 0 var(--space-5); border-radius: var(--radius-control); font: 600 16px/1 var(--font-sans); cursor: pointer; border: 1.5px solid transparent; transition: background var(--dur-fast) var(--ease-standard), color var(--dur-fast) var(--ease-standard); }
  .btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .primary { background: var(--primary); color: var(--on-primary); }
  .primary:hover { background: var(--primary-hover); }
  .secondary { background: transparent; color: var(--primary); border-color: var(--primary); }
  .secondary:hover { background: var(--primary); color: var(--on-primary); }
  .arrow { background: none; border: 0; padding: 0; color: var(--link); font: 600 16px/1.5 var(--font-sans); cursor: pointer; display: inline-flex; gap: var(--space-2); align-items: center; }
  .arrow::after { content: ""; width: 18px; height: 1px; background: currentColor; transition: width var(--dur-fast) var(--ease-standard); }
  .arrow:hover::after { width: 24px; }
</style>
</head>
<body>
  <div class="label">Pedir orçamento / Ver as 22 cores / Ver exemplos</div>
  <div class="row"><button class="btn primary">Pedir orçamento</button><button class="btn secondary">Ver as 22 cores</button><button class="arrow">Ver exemplos</button></div>
</body>
</html>
